name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Synthetic credentials target only the disposable services below, including postinstall.
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  UPSTASH_REDIS_URL: http://localhost:8079
  UPSTASH_REDIS_TOKEN: ci-redis-token
  BETTER_AUTH_SECRET: ci-synthetic-auth-secret-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  ADMIN_EMAIL: admin@example.test
  ADMIN_PASSWORD: Synthetic-CI-only-password-2026!

jobs:
  # ── Build & typecheck & unit tests ──
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-redis-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push schema to test database
        run: pnpm db:push

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: pnpm test

      - name: Verify public table security
        run: bash tests/rls.integration.sh

      - name: Build Next.js app
        run: pnpm build

  # ── E2E tests (Playwright) ──
  # Runs in parallel with the build job — doesn't depend on build artifacts
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-redis-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push schema to test database
        run: pnpm db:push

      - name: Seed test database
        run: pnpm db:seed

      - name: Seed synthetic admin credential
        run: pnpm db:seed-admin

      - name: Seed E2E test data (known document IDs for direct-navigation tests)
        run: npx tsx prisma/seed-e2e.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Next.js dev server
        run: |
          pnpm dev > /tmp/next-dev.log 2>&1 &
          ready=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 2>/dev/null)
            if [ "$code" = "200" ]; then
              echo "Server ready with status $code"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/next-dev.log; exit 1; fi

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 7
